spring:
  cloud:
    nacos:
      server-addr: ${PERF_NACOS_ADDR:127.0.0.1:18848}
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    url: jdbc:mysql://${PERF_MYSQL_HOST:127.0.0.1}:${PERF_MYSQL_PORT:13306}/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: perf_root_only
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  redis:
    host: ${PERF_REDIS_HOST:127.0.0.1}
    port: ${PERF_REDIS_PORT:16379}
    password:
  kafka:
    bootstrap-servers: ${PERF_KAFKA_SERVERS:127.0.0.1:19092}

server:
  port: 8081

red-packet:
  expire-seconds: 60

perf:
  skip-message-dispatch: true

logging:
  level:
    com.shanyangcode.infinitechat.messageingservice.service.impl.MessageServiceImpl: WARN
